<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
 
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Student Registration</h2>
        
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">-- Select a Course --</option>
                    <option value="Computer Science">B.Tech CSE</option>
                    <option value="Web Development">Web Designing & Development</option>
                    <option value="Data Analytics">Data Analytics & ML</option>
                    <option value="Graphic Design">Graphic Design</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min. 6 characters">
            </div>

            <button type="submit" id="registerBtn">Register</button>
        </form>

        <p id="message"></p>
    </div>

  
    <script src="script.js"></script>
</body>
</html>
