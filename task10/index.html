<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Counter App</title>
    
    <link rel="stylesheet"href="style.css">
</head>
<body>

    <div class="counter-container">
        <h1>My Counter App</h1>

        
        <div id="counterValue" class="counter-display zero">0</div>

       
        <p id="statusMessage" class="status-msg"></p>

       
        <div class="button-group">
            <button id="decreaseBtn" class="btn decrease">Decrease (-1)</button>
            <button id="resetBtn" class="btn reset">Reset</button>
            <button id="increaseBtn" class="btn increase">Increase (+1)</button>
        </div>

      
        <div class="extra-controls">
            <button id="increaseFiveBtn" class="btn-bonus">Increase (+10)</button>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
