<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Background Color Changer</h1>
        

        <p class="color-display">
            Current Color: <span id="colorName">Default (#F1F5F9)</span>
        </p>

     
        <div class="button-group">
            <button id="redBtn" class="color-btn red">Red</button>
            <button id="greenBtn" class="color-btn green">Green</button>
            <button id="blueBtn" class="color-btn blue">Blue</button>
            <button id="yellowBtn" class="color-btn yellow">Yellow</button>

            <button id="randomBtn" class="color-btn random">Random Color</button>
            <button id="resetBtn" class="color-btn reset">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
